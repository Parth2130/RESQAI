services:
  - type: web
    name: resqai-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        value: admin@resqai.in
      - key: INITIAL_ADMIN_PASSWORD
        value: ResqAdmin@2026
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: NUGEN_API_KEY
        sync: false
      - key: NUGEN_MODEL
        value: nugen-chat-pro
      - key: NUGEN_BASE_URL
        value: https://api.nugen.in/v1
